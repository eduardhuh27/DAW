<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio V - Cadastro</title>
    <link rel="stylesheet" href="style/cadastro.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/login.css">
</head>
<body>


    <header class="header">
        <div class="logo">
            <h2>STUDIO V</h2> 
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Voltar ao Início</a></li>
            </ul>
        </nav>
    </header>

    <section class="signup-section">
        <div class="login-overlay"></div>
        
        <div class="login-card signup-card">
            <h3 class="gold-text-cursive">Junte-se a nós</h3>
            <h2>CRIAR CONTA</h2>
            
            <form id="formCadastro">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Seu melhor e-mail" required>
                    </div>


                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" required>
                    </div>
                </div>

                <button type="submit" class="btn-gold full-width-btn">CADASTRAR</button>
            </form>

            <div id="resultadoAjax" style="margin-top: 15px; font-weight: bold; min-height: 24px;"></div>

            <p class="signup-link">Já possui uma conta? <a href="login.html">Entre aqui</a></p>
        </div>
    </section>

    <script>
        document.getElementById("formCadastro").addEventListener("submit", function(event) {
            event.preventDefault(); 

            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;
            
            let divMsg = document.getElementById("resultadoAjax");

            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    try {
                        let obj = JSON.parse(this.responseText);
                        divMsg.innerHTML = obj.mensagem;
                        
                        if (obj.sucesso) {
                            divMsg.style.color = "green";
                            setTimeout(() => {
                                window.location.href = "login.html";
                            }, 2000);
                        } else {

                        }
                    } catch (e) {
                        divMsg.innerHTML = "Erro ao processar resposta do servidor.";

                        console.error(this.responseText);
                    }
                } else if (this.readyState == 4) {
                    divMsg.innerHTML = "Erro de conexão com o banco de dados.";

                }
            };

            xhttp.open("POST", "processaCadastro.php", true);
            xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            
            let dados = "nome=" + encodeURIComponent(nome) + 
                        "&email=" + encodeURIComponent(email) + 
                        "&senha=" + encodeURIComponent(senha);
            
            xhttp.send(dados);
        });
    </script>
    <script src="auth.js"></script>
</body>
</html>
