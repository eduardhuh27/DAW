    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style6.css"><link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/style4.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">STUDIO V</div>
            <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servico.html">Serviços</a></li>
        <li><a href="agendar.html">Agendar</a></li>
        <li><a href="promocoes.html">Promoções</a></li>
    </ul>
        </div>
        <a href="login.html" class="login-btn">
            <i class="fas fa-user-circle" style="font-size: 24px;"></i> Entrar
        </a>
    </header>
    <div id="modalErroLogin" class="modal-overlay">
    <div class="modal-content" >
        <i class="fas fa-lock" style="font-size: 50px; color: #c79419; margin-bottom: 20px;"></i>
        <h2 style="color: #333; margin-bottom: 15px;">Usuário não encontrado</h2>
        <p id="msgErroLogin" >Faça login para continuar.</p>
        <button onclick="window.location.href='login.html'" class="btn-gold" style="width: 100%;">IR PARA LOGIN</button>
    </div>
    </div>

    <main class="appointments-container">
        <div class="appointments-grid" id="gridAgendamentos">
            <p style="text-align: center; font-weight: bold;">A buscar os seus agendamentos...</p>
        </div>
    </main>

    <script>
        function irParaPagamento(id, valor) {
   
    sessionStorage.setItem('idPedido', id);
    sessionStorage.setItem('valorPedido', valor);
    window.location.href = 'pagamento.html';
}
        document.addEventListener("DOMContentLoaded", function() {
            let grid = document.getElementById("gridAgendamentos");

            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    try {
                        let obj = JSON.parse(this.responseText);
                        if (obj.erro_login) {
                            document.getElementById("msgErroLogin").innerText = obj.mensagem;
                            document.getElementById("modalErroLogin").style.display = "flex";
                            return; 
                        }
                        if (obj.sucesso) {
                            grid.innerHTML = obj.html;
                        } else {
                            grid.innerHTML = "<p style='color: red;'>" + obj.mensagem + "</p>";
                        }
                    } catch (e) {
                        grid.innerHTML = "<p style='color: brown;'>Erro ao processar dados do servidor.</p>";
                        console.error("Erro:", this.responseText);
                    }
                } else if (this.readyState == 4) {
                    grid.innerHTML = "<p style='color: red;'>Erro de conexão com o banco.</p>";
                }
            };

            xhttp.open("GET", "processaAgendamentos.php", true);
            xhttp.send();
        });
    </script>
    <script src="auth.js"></script>
</body>
</html>
