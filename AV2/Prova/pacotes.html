<head>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style4.css">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">STUDIO V</div>
           <ul class="nav-menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servico.html">Serviços</a></li>

        </div>
        <a href="login.html" class="login-btn">
            <i class="fas fa-user-circle" style="font-size: 24px;"></i> Label
        </a>
    </header>

    <main class="promotions-container">
   
<section class="promocoes-section">
 
    <div class="promocoes-grid" id="gridPromocoes">
        <p style="text-align: center; color: white;">A carregar promoções exclusivas...</p>
    </div>
</section>
    </main>
    <script>
document.addEventListener("DOMContentLoaded", function() {
    let grid = document.getElementById("gridPromocoes");

    let xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            try {
                let obj = JSON.parse(this.responseText);
                
                if (obj.sucesso) {
                    grid.innerHTML = ""; 
                    obj.dados.forEach(function(promo) {

                        let cartaoHTML = `
                            <div class="promo-card" style="background: #333; padding: 30px; border-radius: 15px; text-align: center; color: white; display: flex; flex-direction: column; justify-content: space-between;">
                                
                                <div>
                                    <h2 style="font-size: 24px; margin-bottom: 20px;">${promo.titulo}</h2>
                                    <p style="font-size: 14px; line-height: 1.5; margin-bottom: 30px;">${promo.descricao}</p>
                                </div>
                                
                                <div>
                                    <p style="font-size: 12px; font-weight: bold; margin-bottom: 15px;">${promo.regra_uso}</p>
                                    <button class="btn-resgatar" style="color: #c79419; background: transparent; border: none; font-weight: bold; cursor: pointer;">Resgatar</button>
                                </div>
                                
                            </div>
                        `;
                        grid.innerHTML += cartaoHTML;
                    });
                } else {
                    grid.innerHTML = "<p style='color: red; text-align: center;'>Erro ao carregar promoções: " + obj.mensagem + "</p>";
                }
            } catch (e) {
                console.error("Erro ao analisar JSON:", this.responseText);
                grid.innerHTML = "<p style='color: red; text-align: center;'>Erro interno ao processar as promoções.</p>";
            }
        }
    };
    xhttp.open("GET", "buscarPromocoes.php", true);
    xhttp.send();
});
</script>
<script src="auth.js"></script>
</body>
</html>
